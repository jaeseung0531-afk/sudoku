<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>SUDOKU</title>
  <meta name="description" content="오프라인에서도 즐기는 스도쿠 게임">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="스도쿠">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="title-row">
        <h1 class="title">SUDOKU</h1>
        <div class="icon-buttons">
          <button type="button" id="install-btn" class="icon-btn install-btn" aria-label="앱 설치" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5" /><path d="M5 21h14" /></svg>
            <span>설치</span>
          </button>
          <button type="button" id="stats-btn" class="icon-btn" aria-label="통계">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>
          </button>
          <button type="button" id="theme-btn" class="icon-btn" aria-label="다크 모드로 전환">
            <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
            <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" /><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" /></svg>
          </button>
        </div>
      </div>
      <div class="status-row">
        <button type="button" id="difficulty-chip" class="chip" aria-label="난이도 변경">
          <span id="difficulty-label">난이도</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        </button>
        <div class="status-item"><span class="status-label">실수</span><span id="mistake-count">0</span></div>
        <div class="status-item"><span class="status-label">힌트</span><span id="hint-count">0</span></div>
        <div class="timer" id="timer" aria-live="off">00:00</div>
      </div>
    </header>

    <main class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="스도쿠 보드"></div>
    </main>

    <section class="controls">
      <div class="actions">
        <button type="button" id="undo-btn" class="action-btn" aria-label="되돌리기 (U)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
          <span>되돌리기</span>
        </button>
        <button type="button" id="erase-btn" class="action-btn" aria-label="지우기 (Delete)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20H8.5L3.6 15.1a2 2 0 0 1 0-2.8L12.3 3.6a2 2 0 0 1 2.8 0l5.3 5.3a2 2 0 0 1 0 2.8L12 20" /><path d="M7 11l6 6" /></svg>
          <span>지우기</span>
        </button>
        <button type="button" id="notes-btn" class="action-btn" aria-pressed="false" aria-label="메모 모드 (M)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" /></svg>
          <span>메모 <b id="notes-state">OFF</b></span>
        </button>
        <button type="button" id="hint-btn" class="action-btn" aria-label="힌트 (H)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4" /><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z" /></svg>
          <span>힌트</span>
        </button>
        <button type="button" id="new-btn" class="action-btn" aria-label="새 게임 (N)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span>새 게임</span>
        </button>
      </div>
      <div id="number-pad" class="number-pad" aria-label="숫자 입력"></div>
      <p class="key-help">키보드: 1~9 입력 · 방향키 이동 · Del 삭제 · M 메모 · H 힌트 · N 새 게임 · U 되돌리기</p>
    </section>
  </div>

  <!-- 난이도 선택 -->
  <div class="modal" id="difficulty-modal" role="dialog" aria-modal="true" aria-labelledby="difficulty-title">
    <div class="sheet">
      <h2 id="difficulty-title">난이도 선택</h2>
      <p id="difficulty-note" class="sheet-note">새 게임을 시작하면 진행 중인 게임은 사라집니다.</p>
      <div id="difficulty-list" class="difficulty-list"></div>
      <button type="button" id="difficulty-cancel" class="ghost-btn">취소</button>
    </div>
  </div>

  <!-- 게임 완료 -->
  <div class="modal" id="complete-modal" role="dialog" aria-modal="true" aria-labelledby="complete-title">
    <div class="sheet center">
      <div class="trophy" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z" /><path d="M17 5h3v2a4 4 0 0 1-4 4M7 5H4v2a4 4 0 0 0 4 4" /></svg>
      </div>
      <h2 id="complete-title">축하합니다!</h2>
      <p id="record-badge" class="record-badge" hidden>새로운 최고 기록!</p>
      <dl class="result-list">
        <div><dt>완성 시간</dt><dd id="done-time">00:00</dd></div>
        <div><dt>난이도</dt><dd id="done-difficulty">-</dd></div>
        <div><dt>힌트 사용</dt><dd id="done-hints">0회</dd></div>
        <div><dt>실수</dt><dd id="done-mistakes">0회</dd></div>
        <div><dt>최고 기록</dt><dd id="done-best">--:--</dd></div>
      </dl>
      <div class="sheet-buttons">
        <button type="button" id="same-diff-btn" class="primary-btn" data-autofocus>같은 난이도로 새 게임</button>
        <button type="button" id="replay-btn" class="secondary-btn">다시 하기</button>
        <button type="button" id="change-diff-btn" class="secondary-btn">난이도 변경</button>
      </div>
    </div>
  </div>

  <!-- 통계 -->
  <div class="modal" id="stats-modal" role="dialog" aria-modal="true" aria-labelledby="stats-title">
    <div class="sheet">
      <h2 id="stats-title">통계</h2>
      <div id="stats-summary" class="stats-summary"></div>
      <h3>난이도별</h3>
      <div id="stats-table" class="stats-table"></div>
      <h3>최근 완료 기록</h3>
      <ul id="stats-records" class="stats-records"></ul>
      <button type="button" id="stats-close" class="primary-btn" data-autofocus>닫기</button>
    </div>
  </div>

  <div id="loading" class="loading" aria-live="polite">
    <div class="spinner"></div>
    <p>퍼즐 생성 중…</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
